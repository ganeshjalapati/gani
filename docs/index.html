<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine Surprise</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  text-align:center;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  color:white;
  overflow-x:hidden;
}

/* Floating Hearts */
.heart{
  position:fixed;
  bottom:-10px;
  color:#fff;
  animation:floatUp 6s linear infinite;
  font-size:20px;
}
@keyframes floatUp{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-100vh);opacity:0;}
}

/* Sections */
section{
  padding:50px 20px;
  display:none;
}

/* Envelope */
.envelope{
  width:200px;
  height:150px;
  background:#ff4d6d;
  margin:100px auto;
  border-radius:10px;
  cursor:pointer;
  position:relative;
}
.envelope:before{
  content:"";
  position:absolute;
  top:-75px;
  left:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:75px solid #ff4d6d;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:20px;
  font-size:18px;
  cursor:pointer;
  margin:10px;
}

/* Slideshow */
.slideshow img{
  width:250px;
  height:300px;
  object-fit:cover;
  border-radius:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* Proposal */
#no{
  position:absolute;
}

/* Mobile Responsive */
@media(max-width:768px){
  body{
    padding:0;
    margin:0;
  }
  
  .envelope{
    width:150px;
    height:120px;
    margin:50px auto;
  }
  
  .envelope:before{
    top:-60px;
    border-left:75px solid transparent;
    border-right:75px solid transparent;
    border-bottom:60px solid #ff4d6d;
  }
  
  h1{
    font-size:24px;
    margin:20px 10px;
  }
  
  h2{
    font-size:18px;
    margin:15px 10px;
  }
  
  p{
    font-size:14px;
    margin:15px 10px;
  }
  
  .slideshow img{
    width:200px;
    height:250px;
  }
  
  button{
    padding:8px 16px;
    font-size:16px;
    margin:8px 5px;
  }
  
  section{
    padding:30px 10px;
  }
}

@media(max-width:480px){
  h1{
    font-size:20px;
    margin:15px 5px;
  }
  
  h2{
    font-size:16px;
    margin:10px 5px;
  }
  
  p{
    font-size:12px;
    margin:10px 5px;
  }
  
  .slideshow img{
    width:150px;
    height:200px;
  }
  
  .envelope{
    width:120px;
    height:100px;
    margin:40px auto;
  }
  
  .envelope:before{
    top:-50px;
    border-left:60px solid transparent;
    border-right:60px solid transparent;
    border-bottom:50px solid #ff4d6d;
  }
  
  button{
    padding:6px 12px;
    font-size:14px;
    margin:6px 4px;
    width:80px;
  }
  
  section{
    padding:20px 5px;
  }
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio autoplay loop>
  <source src="./Arerey_Manasa.mp3" type="audio/mpeg">
</audio>

<!-- ENVELOPE SECTION -->
<div class="envelope" onclick="openLetter()"></div>
<h2>Click the envelope 💌</h2>

<!-- MAIN CONTENT -->
<section id="main">

<h1>Happy Valentine's Day <span id="name"></span> 💖</h1>

<!-- Love Message -->
<p>
You are the most beautiful part of my life 🌹 <br>
Every heartbeat of mine whispers your name 💕
</p>

<!-- Slideshow -->
<div class="slideshow">
  <img id="slide" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=400&h=500&fit=crop">
</div>

<!-- Proposal -->
<h2>Will You Be My Valentine? 💍</h2>
<button onclick="yesLove()">Yes 💕</button>
<button id="no" onmouseover="moveNo()">No 😜</button>

</section>

<script>

/* Ask for Password */
let personName = prompt("Enter your love's name:");

if(personName && personName.toLowerCase() === "baby"){
  document.getElementById("name").innerText = personName;
} else {
  const isMobile = window.innerWidth <= 768;
  const fontSize = isMobile ? "24px" : "50px";
  const marginTop = isMobile ? "50px" : "200px";
  const padding = isMobile ? "20px" : "0px";
  document.body.innerHTML = `<h1 style='margin-top: ${marginTop}; font-size: ${fontSize}; padding: ${padding}; line-height: 1.4;'>You're not my partner this time 💕 my heart is already filled with someone, but I'll always wish you love and happiness — maybe our paths will cross in another life</h1>`;
}

/* Open Envelope */
function openLetter(){
  document.querySelector(".envelope").style.display="none";
  document.querySelector("h2").style.display="none";
  document.getElementById("main").style.display="block";
}

/* Countdown */
function updateCountdown(){
  const valentine = new Date("Feb 14, 2026 00:00:00").getTime();
  const now = new Date().getTime();
  const gap = valentine - now;

  const days = Math.floor(gap/(1000*60*60*24));
  const hours = Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const minutes = Math.floor((gap%(1000*60*60))/(1000*60));

  document.getElementById("countdown").innerText =
    "Countdown: "+days+"d "+hours+"h "+minutes+"m ";
}

/* Slideshow */
let images = [
 "./lg2.jpeg",
 "./lovegure1.jpeg",
 "./v3.jpeg",
 "./v1.jpeg"
];
let i=0;
setInterval(()=>{
  i=(i+1)%images.length;
  document.getElementById("slide").src=images[i];
},3000);

/* Floating Hearts */
function createHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤️";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=Math.random()*20+15+"px";
  document.body.appendChild(heart);
  setTimeout(()=>{heart.remove()},6000);
}
setInterval(createHeart,400);

/* Proposal */
function yesLove(){
  document.body.innerHTML="<h1>I Love You Forever ❤️</h1>";
}

function moveNo(){
  const no=document.getElementById("no");
  no.style.top=Math.random()*80+"vh";
  no.style.left=Math.random()*80+"vw";
}

</script>

</body>
</html>
